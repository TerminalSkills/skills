name: Sync skills to production DB

on:
  push:
    branches: [production]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync skills and use cases to production DB
        env:
          # The sync endpoint lives on the NestJS BACKEND (api.terminalskills.io),
          # not the website — the Next app has no /api routes since the migration.
          # PLATFORM_URL still pointed at the site, so every run 404'd. Default to
          # the public backend (same value the site itself defaults to) and let
          # API_URL override it for a staging host.
          API_URL: ${{ secrets.API_URL || 'https://api.terminalskills.io' }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${API_URL}/api/sync" \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Response ($http_code):"
          echo "$body" | jq . 2>/dev/null || echo "$body"

          # The backend answers 201 Created on a successful sync; only 200 was
          # accepted, so a sync that WORKED was reported as a failed run.
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Sync failed with HTTP $http_code"
            exit 1
          fi
